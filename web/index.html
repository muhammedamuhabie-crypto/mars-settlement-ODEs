const domeRadius = 4.40;

// Geodesic triangular bronze framework
const icoGeometry = new THREE.IcosahedronGeometry(domeRadius, 2);
const icoPositions = icoGeometry.attributes.position;
const icoIndex = icoGeometry.index;
const frameEdges = new Map();

function pointKey(p) {
  return `${p.x.toFixed(4)},${p.y.toFixed(4)},${p.z.toFixed(4)}`;
}

function addFrameEdge(a, b) {
  const ka = pointKey(a);
  const kb = pointKey(b);
  const key = ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
  if (!frameEdges.has(key)) {
    frameEdges.set(key, [a.clone(), b.clone()]);
  }
}

function clipTriangle(points) {
  const output = [];

  for (let i = 0; i < points.length; i++) {
    const a = points[i];
    const b = points[(i + 1) % points.length];
    const insideA = a.y >= -0.00001;
    const insideB = b.y >= -0.00001;

    if (insideA && insideB) {
      output.push(b.clone());
    } else if (insideA && !insideB) {
      const t = a.y / (a.y - b.y);
      output.push(a.clone().lerp(b, t));
    } else if (!insideA && insideB) {
      const t = a.y / (a.y - b.y);
      output.push(a.clone().lerp(b, t));
      output.push(b.clone());
    }
  }
  return output;
}

const faceCount = icoIndex
  ? icoIndex.count / 3
  : icoPositions.count / 3;

for (let face = 0; face < faceCount; face++) {
  const ids = icoIndex
    ? [
        icoIndex.getX(face * 3),
        icoIndex.getX(face * 3 + 1),
        icoIndex.getX(face * 3 + 2)
      ]
    : [face * 3, face * 3 + 1, face * 3 + 2];

  const triangle = ids.map(id =>
    new THREE.Vector3().fromBufferAttribute(icoPositions, id)
  );

  const clipped = clipTriangle(triangle);

  for (let j = 0; j < clipped.length; j++) {
    addFrameEdge(clipped[j], clipped[(j + 1) % clipped.length]);
  }
}

const frameVertices = [];
const jointPositions = new Map();

for (const edge of frameEdges.values()) {
  const a = edge[0];
  const b = edge[1];

  frameVertices.push(a.x, a.y, a.z, b.x, b.y, b.z);
  jointPositions.set(pointKey(a), a);
  jointPositions.set(pointKey(b), b);
}

const frameGeometry = new THREE.BufferGeometry();
frameGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(frameVertices, 3)
);

const domeFrame = new THREE.LineSegments(
  frameGeometry,
  new THREE.LineBasicMaterial({
    color: 0xd5a36b, transparent: true, opacity: 0.98
  })
);
domeFrame.position.y = domeBase;
habitat.add(domeFrame);

// Bronze connection joints
const jointGeometry = new THREE.SphereGeometry(0.055, 8, 8);
for (const point of jointPositions.values()) {
  const joint = new THREE.Mesh(jointGeometry, bronzeMat);
  joint.position.set(point.x, point.y + domeBase, point.z);
  habitat.add(joint);
}

// Interior living modules
const moduleMat = new THREE.MeshStandardMaterial({
  color: 0xc4c2b9, metalness: 0.38, roughness: 0.48
});
const moduleDarkMat = new THREE.MeshStandardMaterial({
  color: 0x777e80, metalness: 0.65, roughness: 0.4
});

function addLivingModule(z, length, radius) {
  const centerY = 1.72;

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 48, 1),
    moduleMat
  );
  body.rotation.z = Math.PI / 2;
  body.position.set(0, centerY, z);
  habitat.add(body);

  // Circular glazed ends
  for (const side of [-1, 1]) {
    const cap = new THREE.Mesh(
      new THREE.CircleGeometry(radius * 0.79, 40),
      blueGlassMat
    );
    cap.position.set(side * (length / 2 + 0.012), centerY, z);
    cap.rotation.y = Math.PI / 2;
    habitat.add(cap);

    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(radius * 0.82, 0.07, 12, 40),
      bronzeMat
    );
    rim.rotation.y = Math.PI / 2;
    rim.position.set(side * (length / 2 + 0.02), centerY, z);
    habitat.add(rim);
  }

  // Reinforced structural bands
  for (const x of [-length * 0.36, 0, length * 0.36]) {
    const band = new THREE.Mesh(
      new THREE.TorusGeometry(radius * 1.005, 0.055, 10, 40),
      moduleDarkMat
    );
    band.rotation.y = Math.PI / 2;
    band.position.set(x, centerY, z);
    habitat.add(band);
  }

  // Upper observation windows
  for (const x of [-1.05, -0.35, 0.35, 1.05]) {
    const windowMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.38, 0.15, 0.045),
      blueGlassMat
    );
    windowMesh.position.set(x, centerY + radius * 0.78, z);
    habitat.add(windowMesh);
  }
}

addLivingModule(-0.82, 3.75, 0.76);
addLivingModule(0.92, 3.75, 0.76);

// Greenhouse growing beds
const soilMat = new THREE.MeshStandardMaterial({
  color: 0x39271a, roughness: 1
});
const bedMat = new THREE.MeshStandardMaterial({
  color: 0x817c6d, metalness: 0.4, roughness: 0.6
});

const greenMat = new THREE.MeshStandardMaterial({
  color: 0x238d42,
  emissive: 0x14552a,
  emissiveIntensity: 0.45,
  roughness: 0.78
});

const leafLightMat = new THREE.MeshStandardMaterial({
  color: 0x60b94b, roughness: 0.8
});
const stemMat = new THREE.MeshStandardMaterial({
  color: 0x537d38
});

function addPlant(x, z, scale = 1) {
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025 * scale, 0.045 * scale,
      0.48 * scale, 8),
    stemMat
  );
  stem.position.set(x, 0.65 + 0.24 * scale, z);
  habitat.add(stem);

  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2;
    const leaf = new THREE.Mesh(
      new THREE.SphereGeometry(0.17 * scale, 10, 8),
      i % 2 ? greenMat : leafLightMat
    );
    leaf.scale.set(1.25, 0.48, 0.7);
    leaf.position.set(
      x + Math.cos(angle) * 0.16 * scale,
      0.82 + 0.2 * scale,
      z + Math.sin(angle) * 0.16 * scale
    );
    habitat.add(leaf);
  }
}

function addGrowingBed(x, z, width, depth) {
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.2, depth),
    bedMat
  );
  base.position.set(x, 0.57, z);
  habitat.add(base);

  const soil = new THREE.Mesh(
    new THREE.BoxGeometry(width - 0.12, 0.08, depth - 0.12),
    soilMat
  );
  soil.position.set(x, 0.70, z);
  habitat.add(soil);

  const count = Math.max(2, Math.floor(width / 0.28));
  for (let i = 0; i < count; i++) {
    const px = x - width * 0.36 + i * (width * 0.72 / Math.max(1, count - 1));
    for (const dz of [-depth * 0.22, depth * 0.22]) {
      addPlant(px, z + dz, 0.9);
    }
  }
}

addGrowingBed(-2.65, 1.8, 1.15, 1.25);

addGrowingBed(0.25, 2.65, 1.15, 1.0);

function createTank(x, z, color) {
  const group = new THREE.Group();

  const tankMaterial = new THREE.MeshStandardMaterial({
    color, metalness: 0.38, roughness: 0.3
  });

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72, 0.72, 3.45, 40),
    tankMaterial
  );
  body.position.y = 1.95;
  group.add(body);

  const top = new THREE.Mesh(
    new THREE.SphereGeometry(0.72, 32, 12, 0, Math.PI * 2, 0, Math.PI / 2),
    tankMaterial
  );
  top.position.y = 3.675;
  group.add(top);

  const bottom = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72, 0.72, 0.14, 32),
    darkMetalMat
  );
  bottom.position.y = 0.22;
  group.add(bottom);

  for (const y of [0.65, 2.9, 3.35]) {
    const band = new THREE.Mesh(
      new THREE.TorusGeometry(0.73, 0.045, 8, 40),
      bronzeMat
    );
    band.rotation.x = Math.PI / 2;
    band.position.y = y;
    group.add(band);
  }

  for (let i = 0; i < 3; i++) {
    const foot = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.38, 0.16),
      darkMetalMat
    );
    const a = i * Math.PI * 2 / 3;
    foot.position.set(Math.cos(a) * 0.52, 0.12, Math.sin(a) * 0.52);
    group.add(foot);
  }

  group.position.set(x, 0, z);
  scene.add(group);

  // Dynamic body retained for ODE scaling
  group.userData.body = body;
  return group;
}

  darkMetalMat
);
wallBase.position.set(-3.35, 0.12, 5.35);

for (let i = 0; i < 12; i++) {
  const nodeMesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.34, 2.25, 0.72),

  nodeMesh.position.set(-5.32 + i * 0.36, 1.28, 5.35);
  scene.add(nodeMesh);
  wallNodes.push(nodeMesh);
}

// ============================================================
// END OF VISUAL SCENE
// ============================================================
const resp = await fetch('./sim_data.json');
    const simData = await resp.json();

    const select = document.getElementById('scenarioSelect');
    const slider = document.getElementById('timeSlider');
    let currentKey = 'dust_storm';
    let playing = true;

    for (const [k, v] of Object.entries(simData.scenarios)) {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = v.title;
      if (k === currentKey) opt.selected = true;
      select.appendChild(opt);
    }

    select.addEventListener('change', (e) => { currentKey = e.target.value; });
    document.getElementById('playBtn').addEventListener('click', () => { playing = !playing; });

    function updateSceneFromODE(idx) {
      const s = simData.scenarios[currentKey];
      const cap = simData.meta.capacities;
      const thr = simData.meta.thresholds;

      const w = s.water[idx], o = s.oxygen[idx], f = s.food[idx], e = s.energy[idx];
      const phi = s.solar_factor[idx];
      const tExt = s.wall_temp_c[0][idx];
      const tInt = s.wall_temp_c[s.wall_temp_c.length - 1][idx];

      const scaleTank = (mesh, val, maxVal) => {
        const ratio = Math.max(0.05, Math.min(1.0, val / maxVal));
        mesh.scale.y = ratio;
        mesh.position.y = 2.0 * ratio;
      };
      scaleTank(waterTank, w, cap.water);
      scaleTank(o2Tank, o, cap.oxygen);
      scaleTank(batBank, e, cap.energy);

      greenMat.emissiveIntensity = 0.1 + 1.4 * (f / cap.food);

      for (let i = 0; i < wallNodes.length; i++) {
        const tempC = s.wall_temp_c[i][idx];
        const norm = Math.max(0, Math.min(1, (tempC + 80) / 102));
        wallNodes[i].material.color.setHSL(0.65 * (1 - norm), 0.85, 0.5);
      }

      sun.intensity = 2.3 * phi;
      scene.fog.density = phi < 0.3 ? 0.025 : 0.012;
      scene.fog.color.setHex(phi < 0.3 ? 0x854326 : 0x4a2a1c);
      scene.background.setHex(phi < 0.3 ? 0x854326 : 0x4a2a1c);

      document.getElementById('dayLabel').textContent = `${s.t[idx].toFixed(0)} / 1000`;
      document.getElementById('valWater').textContent = `${w.toFixed(0)} L`;
      document.getElementById('valO2').textContent = `${o.toFixed(0)} kg`;
      document.getElementById('valFood').textContent = `${f.toFixed(0)} kg`;
      document.getElementById('valEnergy').textContent = `${e.toFixed(0)} kWh`;
      document.getElementById('valTemp').textContent = `${tExt.toFixed(1)}Â°C â†’ ${tInt.toFixed(1)}Â°C`;

      document.getElementById('barWater').style.width = `${Math.min(100, (w / cap.water) * 100)}%`;
      document.getElementById('barO2').style.width = `${Math.min(100, (o / cap.oxygen) * 100)}%`;
      document.getElementById('barFood').style.width = `${Math.min(100, (f / cap.food) * 100)}%`;
      document.getElementById('barEnergy').style.width = `${Math.min(100, (e / cap.energy) * 100)}%`;

      const alertBox = document.getElementById('alert');
      if (w < thr.water || o < thr.oxygen || f < thr.food || e < thr.energy) {
        alertBox.className = 'crit';
        alertBox.textContent = 'CRITICAL THRESHOLD BREACHED';
      } else if (phi < 0.3) {
        alertBox.className = 'warn';
        alertBox.textContent = 'GLOBAL DUST STORM â€” SOLAR DEGRADED';
      } else {
        alertBox.className = 'ok';
        alertBox.textContent = 'NOMINAL ISRU & LIFE SUPPORT';
      }
    }

    let frame = 0;
    function animate() {
      requestAnimationFrame(animate);
      if (playing && frame % 2 === 0) {
        slider.value = (parseInt(slider.value, 10) + 1) % 501;
      }
      frame++;
      updateSceneFromODE(parseInt(slider.value, 10));
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
